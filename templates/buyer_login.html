<script>

var configuration = {
    widgetId: "366774643541373035313139",
    tokenAuth: "547072T7VBJ7DM6a5dce97P1",
    identifier: "",

    exposeMethods: true,

    success: function(data){

        fetch("/verify-msg91",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                accessToken:data.token
            })
        })
        .then(r=>r.json())
        .then(res=>{

            if(res.success){
                window.location="/home";
            }else{
                alert("OTP Failed");
            }

        });

    },

    failure:function(error){
        console.log(error);
    }

};

function sendOTP(){

    configuration.identifier =
    document.querySelector("input[name='phone']").value;

    initSendOTP(configuration);

}

</script>
