<!DOCTYPE html>
<html>
<head>

<title>Property Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="landing-page">


<div class="container mt-5 p-4 bg-white bg-opacity-75 rounded shadow"></div>

<h2>{{ room[2] }}</h2>

<img
src="/static/uploads/{{ room[7] }}"
class="img-fluid mb-3"
width="500">

<h4>Rent: ₹{{ room[3] }}</h4>

<p><b>Area:</b> {{ room[4] }}</p>

<p><b>Address:</b> {{ room[5] }}</p>

<p><b>Contact:</b> {{ room[6] }}</p>

<p><b>Property Type:</b> {{ room[9]}}</p>

<p><b>Facilities:</b> {{ room[10]}}</p>

<p><b>Occupancy:</b> {{ room[11]}}</p>



<a href="{{ room[8] }}"
target="_blank"
class="btn btn-success">

View Location

{% if session.get("role") == "seller" %}

<a href="/edit/{{ room[0] }}"
class="btn btn-warning">
Edit Property
</a>

{% endif %}

</a>

<a href="/home"
class="btn btn-secondary">

Back

</a>

</div>

</body>
</html>
