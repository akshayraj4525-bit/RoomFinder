<!DOCTYPE html>
<html>
<head>

    <title>Add Property</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="add-property-page">

<div class="add-property-box">

    <h2 class="text-center mb-4">Add Property</h2>

    <form method="POST" enctype="multipart/form-data">

        <select name="room_type" class="form-control mb-3">

            <option>Single Room</option>
            <option>Double Room</option>
            <option>PG</option>
            <option>2 BHK</option>
            <option>4 BHK</option>

        </select>
        <label class="form-label">

Property Type

</label>

<select
name="property_type"
class="form-control mb-3">

    <option>Independent Room</option>

    <option>Shared Room</option>

    <option>PG</option>

    <option>Flat</option>

    <option>Hostel</option>

</select>

        <select
        name="area"
        class="form-control mb-3">

            <option>Prem Nagar</option>
            <option>Kehri Gaon</option>
            <option>Sudhowala</option>
            <option>Thakurpur</option>
            <option>Nanda Ki Chowki</option>

        </select>

        <input
        type="text"
        name="address"
        placeholder="Full Address"
        class="form-control mb-3">

        <input
        type="text"
        name="map_link"
        placeholder="Google Maps Link"
        class="form-control mb-3">

        <input
        type="text"
        name="contact"
        placeholder="Contact Number"
        class="form-control mb-3">

        <input
        type="text"
        name="rent"
        placeholder="Rent"
        class="form-control mb-3">

        <label class="form-label">

Facilities

</label>

<div class="mb-3">

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="facilities"
value="WiFi">

<label class="form-check-label">

    <label class="form-label">

WiFi

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="facilities"
value="AC">

<label class="form-check-label">

AC

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="facilities"
value="Parking">

<label class="form-check-label">

Parking

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="facilities"
value="Attached Bathroom">

<label class="form-check-label">

Attached Bathroom

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="facilities"
value="Kitchen">

<label class="form-check-label">

Kitchen

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="facilities"
value="Balcony">

<label class="form-check-label">

Balcony

</label>

</div>

</div>

        <label class="form-label">

<label class="form-label">
Occupancy
</label>

<select name="occupancy" class="form-control mb-3">

    <option>Boys</option>

    <option>Girls</option>

    <option>Family</option>

    <option>Anyone</option>

</select>

    Upload Property Images
</label>

<input
type="file"
name="images"
class="form-control mb-3"
multiple
accept="image/*">

        <button
        type="submit"
        class="btn btn-primary w-100">

            Add Property

        </button>

    </form>

</div>

</body>
</html>
